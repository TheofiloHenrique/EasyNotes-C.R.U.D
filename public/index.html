<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>EasyNotes!</title>

    <link
    rel="icon"
    type="image/png"
    href="/favicon.png">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet">

</head>


<body>

    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1>EasyNotes:</h1>

            <div class="d-flex align-items-center gap-2">

                <button
                    id="themeToggle"
                    class="btn btn-outline-secondary"
                    type="button">

                    <i class="bi bi-sun-fill"></i>

                </button>


                <button
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#noteModal">

                    <i class="bi bi-plus-lg"></i>
                    Nueva Nota

                </button>

            </div>

        </div>


        <!-- LISTA -->
        <div id="notes">
        </div>

    </div>


    <!-- Primeiro Modal de nota -->
    <div
        class="modal fade"
        id="noteModal"
        tabindex="-1"
        aria-labelledby="noteModalLabel"
        aria-hidden="true">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="noteModalLabel">

                        Nueva nota

                    </h5>


                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar">
                    </button>

                </div>


                <div class="modal-body">

                    <form
                        id="noteForm"
                        novalidate>

                        <div class="mb-3">

                            <label
                                for="title"
                                class="form-label">

                                Título:

                            </label>


                            <input
                                type="text"
                                class="form-control"
                                id="title"
                                required>


                            <div class="invalid-feedback">

                                El título es obligatorio.

                            </div>

                        </div>


                        <div class="mb-3">

                            <label
                                for="content"
                                class="form-label">

                                Contenido:

                            </label>


                            <textarea
                                class="form-control"
                                id="content"
                                rows="4"
                                required></textarea>


                            <div class="invalid-feedback">

                                El contenido es obligatorio.

                            </div>

                        </div>

                    </form>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancelar

                    </button>


                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="saveNote"
                        form="noteForm">

                        <i class="bi bi-check-lg"></i>
                        Guardar

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Modal do Feedback -->
    <div
        class="modal fade"
        id="feedbackModal"
        tabindex="-1"
        aria-labelledby="feedbackTitle"
        aria-hidden="true">

        <div class="modal-dialog modal-sm modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="feedbackTitle">

                        Mensaje

                    </h5>


                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar">
                    </button>

                </div>


                <div class="modal-body text-center">

                    <i
                        id="feedbackIcon"
                        class="bi fs-1">
                    </i>


                    <p
                        id="feedbackMessage"
                        class="mt-3 mb-0">
                    </p>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-primary"
                        data-bs-dismiss="modal">

                        Aceptar

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Modal de confirmação para deletar -->
    <div
        class="modal fade"
        id="deleteModal"
        tabindex="-1"
        aria-labelledby="deleteModalLabel"
        aria-hidden="true">

        <div class="modal-dialog modal-sm modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="deleteModalLabel">

                        Confirmar eliminación

                    </h5>


                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar">
                    </button>

                </div>


                <div class="modal-body text-center">

                    <i
                        class="bi bi-exclamation-triangle-fill text-warning fs-1">
                    </i>


                    <p class="mt-3 mb-0">

                        ¿Está seguro de que desea eliminar esta nota?

                    </p>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancelar

                    </button>


                    <button
                        type="button"
                        class="btn btn-danger"
                        id="confirmDelete">

                        <i class="bi bi-trash"></i>
                        Eliminar

                    </button>

                </div>

            </div>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="script.js"></script>

</body>

</html>
